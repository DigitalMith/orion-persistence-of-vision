# NOTE: This extension no longer reads ltm_config.yaml
# Orion now loads all configuration exclusively from:
#   orion_cli/data/config.yaml

ltm:
  topk_persona: 3
  topk_episodic: 6
  importance_threshold: 0.6
  min_score: 0.7

  boosts:
    tone:
      poetic: 0.05
      defiant: 0.04
      somber: 0.03
      introspective: 0.02
    tags:
      memory: 0.03
      encouragement: 0.01

