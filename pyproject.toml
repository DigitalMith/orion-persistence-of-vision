[project]
name = "orion_cli"
version = "0.1.0"
description = "CLI for Orion AI ecosystem with LTM and Persona support"
authors = [{ name = "John Richards", email = "your@email.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]",
    "chromadb",
    "sentence-transformers",
    "pyyaml",
    "rich",
    "tqdm",
    "numpy>=2.1.0"
]

[project.scripts]
orion-cli = "orion_cli.cli:cli"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicitly tell setuptools to treat this directory as the root
package-dir = {"" = "."}
# Disable discovery — we’ll manually define what counts
packages = []
# Explicitly tell setuptools which files belong to the build
py-modules = [
    "orion_cli",
    "cli",
    "ingest_persona",
    "orion_ltm_integration",
    "persona"
]
include-package-data = true